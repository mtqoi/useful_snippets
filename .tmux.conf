
unbind r
bind r source-file ~/.tmux.conf

# set leader to ctrl+s
set -g prefix C-s
set -g base-index 1 # 1-indexed for window numbering
set -g mouse on
set -g default-terminal "tmux-256color"

# allow hjkl as well as arrow keys
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set-option -g status-position top
set-option -g renumber-windows on 


# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @catppuccin_flavor 'latte'
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-title 'temp'
set -g status-right-length 100
set -g status-left '#[fg=#8839ef,bold]#{?window_zoomed_flag,  , }'


# Make the windows look nice
#set -g @catppuccin_window_default_text " #{window_name}"
set -g @catppuccin_window_status "icon"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_number_position "left"

set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_middle_separator "█"
set -g @catppuccin_window_right_separator "█"

## Window current configuration
#set -g @catppuccin_window_current_text "#{window_name}"
set -g @catppuccin_window_current_fill "all"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_text "#W"
# Status modules config



# Pane focus: dim inactive panes, highlight active border
set -g window-style 'fg=#737994,bg=#292c3c'
set -g window-active-style 'fg=#c6d0f5,bg=#303446'
set -g pane-border-style 'fg=#414559'
set -g pane-active-border-style 'fg=#8caaee,bold'

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Run plugin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Status
set -gF  status-right "#{@catppuccin_status_directory}"
set -agF status-right "#{@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_date_time}"




# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
